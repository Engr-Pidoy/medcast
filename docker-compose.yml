services:
  medcast:
    build: .
    ports:
      - "8080:8000"
    environment:
      APP_NAME: MEDCAST
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
    volumes:
      - medcast_data:/var/www/html/database
      - medcast_storage:/var/www/html/storage

volumes:
  medcast_data:
  medcast_storage:
